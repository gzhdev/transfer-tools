name: build-safecopy-gui-exe

# design D-g4：在 Windows 构建代理上把 GUI 打成单文件 safecopy-gui.exe 并作为 artifact 上传。
# 触发方式：推送 v* 标签，或在 Actions 页面手动 workflow_dispatch。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gui-exe:
    name: 构建 safecopy-gui.exe（windows-latest）
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖（.[gui] + pyinstaller + pytest）
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" "pyinstaller>=6.0" pytest

      - name: 运行测试套件（含 offscreen 界面测试）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: 构建单文件 exe（onefile + windowed）
        run: python -m PyInstaller packaging/safecopy-gui.spec --noconfirm --clean

      - name: 校验产物存在
        run: |
          if (-not (Test-Path "dist/safecopy-gui.exe")) {
            throw "构建失败：未找到 dist/safecopy-gui.exe"
          }
          Get-Item "dist/safecopy-gui.exe" | Format-List Name, Length, LastWriteTime

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: safecopy-gui-windows
          path: dist/safecopy-gui.exe
          if-no-files-found: error
          retention-days: 30
